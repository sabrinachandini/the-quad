name: TheQuad
options:
  bundleIdPrefix: com.thequad
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  TheQuad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TheQuad
        excludes:
          - "**/*.md"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: UserNotifications.framework
      - sdk: EventKit.framework
    resources:
      - TheQuad/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thequad.app
        PRODUCT_NAME: TheQuad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: TheQuad/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  TheQuadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TheQuadTests
    dependencies:
      - target: TheQuad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thequad.tests
        SWIFT_VERSION: "5.10"
